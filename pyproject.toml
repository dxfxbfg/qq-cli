[project]
name = "qq-cli"
version = "2.0.0"
description = "macOS 本机 QQ 聊天记录读取 CLI / Agent 技能（读取 QQ NT 本地数据库）"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "knight sama" }]
keywords = ["qq", "qqnt", "chat-history", "macos", "cli", "agent-skill"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
# 零第三方依赖：仅标准库 + 外部 sqlcipher CLI（见 README）
dependencies = []

[project.scripts]
qq = "qqcli.cli:main"

[project.urls]
Homepage = "https://github.com/dxfxbfg/qq-cli"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# 显式声明包，避免 flat-layout 自动发现把 tests/scripts 也当成包而报错
[tool.setuptools]
packages = ["qqcli"]
